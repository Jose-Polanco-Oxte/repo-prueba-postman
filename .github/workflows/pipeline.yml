name: Automated API tests using Postman CLI

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    
    steps:
      # Levantar el contenedor de backend para pruebas
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del backend (con caché)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: testing-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar contenedor de testing
        run: |
          docker run -d \
            --name backend-test \
            -p 3000:3000 \
            --health-interval=2s \
            --health-start-period=2s \
            --health-retries=15 \
            testing-backend:ci

      - name: Esperar al HEALTHCHECK del Dockerfile
        run: |
          echo "Esperando a que el contenedor reporte estado 'healthy'..."
          timeout 45s bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" backend-test)" = "healthy" ]; do
              status=$(docker inspect -f "{{.State.Status}}" backend-test)
              if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "❌ El contenedor crasheó al iniciar."
                exit 1
              fi
              sleep 1
            done
          '
          echo "Backend listo en http://localhost:3000"
      # Proporcionado por Postman
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run postman collection run 58622358-618c8085-6b97-4aee-9854-621efea1d223 -e 58622358-4949d54d-884c-4b54-8687-0667e0b3ebee -i 58622358-a57b70c3-d745-44f4-953b-ee71f88ee4d9